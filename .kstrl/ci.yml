# Reproduces Molotov GitHub Actions matrix and tox environments.
# Ubuntu runner supplies lsof; the non-root containers build it from a pinned upstream commit.
name: Molotov CI
'on':
- push
- pull_request
jobs:
  python38:
    image: docker.io/library/python@sha256:7aa279fb41dad2962d3c915aa6f6615134baa412ab5aafa9d4384dcaaa0af15d
    timeout: 30m
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 2Gi
    env:
      HOME: /tmp
      PIP_NO_CACHE_DIR: '1'
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Prepare Python
      run: |
        sleep 20
        python --version
        python -m venv /workspace/.ci
    - name: Build lsof (Ubuntu runner tool)
      run: |
        mkdir -p /workspace/.tools
        python - <<'PYTHON'
        import tarfile, urllib.request
        url = "https://codeload.github.com/lsof-org/lsof/tar.gz/646395f8e893edb5572405b2311a079f55f269f2"
        with urllib.request.urlopen(url, timeout=60) as response, open("/tmp/lsof.tar.gz", "wb") as output:
            output.write(response.read())
        with tarfile.open("/tmp/lsof.tar.gz") as archive:
            archive.extractall("/workspace/.tools", filter="data")
        PYTHON
        cd /workspace/.tools/lsof-646395f8e893edb5572405b2311a079f55f269f2
        ./Configure -n linux
        make -j2
        cp lsof /workspace/.ci/bin/lsof
        /workspace/.ci/bin/lsof -v
    - name: Install tox
      run: |
        . /workspace/.ci/bin/activate
        python -m pip install tox tox-gh-actions
    - name: 'Run tox: py38'
      run: |
        . /workspace/.ci/bin/activate
        export NO_PROXY=localhost,127.0.0.1,::1
        export no_proxy="$NO_PROXY"
        tox -e py38
    name: Test on Python 3.8
